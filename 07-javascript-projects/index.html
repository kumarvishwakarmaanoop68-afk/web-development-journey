<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="hero">
            <p class="eyebrow">DAY 7 • JAVASCRIPT PROJECT</p>
            <h1>Smart To-Do List</h1>
            <p>Manage tasks, track progress, and keep your tasks after refresh.</p>
        </header>

        <section class="app">
            <form id="task-form">
                <label for="task-input">Add a task</label>

                <div class="input-row">
                    <input
                        id="task-input"
                        type="text"
                        placeholder="e.g. Practice JavaScript"
                        maxlength="80"
                        autocomplete="off"
                    >
                    <button type="submit">Add Task</button>
                </div>

                <p id="error-message" class="error" aria-live="polite"></p>
            </form>

            <div class="stats">
                <div>
                    <span id="total-count">0</span>
                    <small>Total</small>
                </div>
                <div>
                    <span id="active-count">0</span>
                    <small>Active</small>
                </div>
                <div>
                    <span id="completed-count">0</span>
                    <small>Completed</small>
                </div>
            </div>

            <div class="toolbar">
                <div class="filters" aria-label="Task filters">
                    <button type="button" class="filter active" data-filter="all">All</button>
                    <button type="button" class="filter" data-filter="active">Active</button>
                    <button type="button" class="filter" data-filter="completed">Completed</button>
                </div>

                <button type="button" id="clear-completed" class="secondary">
                    Clear Completed
                </button>
            </div>

            <ul id="task-list" class="task-list"></ul>

            <p id="empty-message" class="empty-message">
                No tasks here. Add one above!
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
