<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">DAY 5 • JAVASCRIPT BASICS</p>
            <h1>JavaScript Profile Dashboard</h1>
            <p>
                A beginner project for practicing variables, conditions,
                loops, functions, arrays, objects, and template literals.
            </p>
        </section>

        <section class="dashboard">
            <article class="card">
                <span class="label">Developer</span>
                <h2 id="profile-name">Loading...</h2>
                <p id="profile-role"></p>
            </article>

            <article class="card">
                <span class="label">Score</span>
                <h2 id="score-value">0</h2>
                <p id="score-message"></p>
            </article>

            <article class="card">
                <span class="label">Skill Level</span>
                <h2 id="level-value">Loading...</h2>
                <p id="level-message"></p>
            </article>

            <article class="card skills-card">
                <span class="label">Skills</span>
                <ul id="skills-list"></ul>
            </article>
        </section>

        <section class="card summary">
            <span class="label">Profile Summary</span>
            <p id="summary-text"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
